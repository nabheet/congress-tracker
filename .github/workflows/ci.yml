name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"

      - name: Sync deps (frozen)
        run: uv sync --frozen --no-dev

      - name: Byte-compile
        run: uv run python -m py_compile pull_congress.py

      - name: Type check
        run: uv run pyright pull_congress.py

  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"

      - name: Sync deps (frozen, dev group)
        run: uv sync --frozen

      - name: Run tests with coverage gate
        run: uv run pytest tests/ --cov=pull_congress --cov-report=term-missing --cov-fail-under=90

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t congress-pull:ci .

      - name: Verify supercronic present
        run: docker run --rm --entrypoint /usr/local/bin/supercronic congress-pull:ci -version

  publish-image:
    name: Publish Docker image
    if: github.event_name == 'push'
    needs: [lint-and-typecheck, test, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              # pre-release tag (contains a hyphen, e.g. v0.2.0-beta.1) —
              # own tag only, do NOT bump `latest`
              TAGS="${IMG}:${GITHUB_REF_NAME}"
            else
              TAGS="${IMG}:${GITHUB_REF_NAME},${IMG}:latest"
            fi
          else
            # main push: auto-increment patch from the highest existing
            # vX.Y.Z tag on GHCR (registry-derived, like the npm stable
            # publish — never trust a possibly-stale local version).
            # GHCR requires a bearer token even for public images (anonymous
            # tags/list returns 401). The anonymous pull token works with no
            # credentials; the GitHub packages API would need packages:read
            # scope, which GITHUB_TOKEN with packages:write alone lacks.
            REG_NAME="${IMG#ghcr.io/}"
            REG_TOKEN=$(curl -fsSL \
                "https://ghcr.io/token?scope=repository:${REG_NAME}:pull" \
                2>/dev/null | jq -r '.token // empty')
            if [[ -z "$REG_TOKEN" ]]; then
              echo "WARN: could not get GHCR token; falling back to v0.1.0"
              NEXT="v0.1.0"
            else
              JSON=$(curl -fsSL \
                  -H "Authorization: Bearer ${REG_TOKEN}" \
                  "https://ghcr.io/v2/${REG_NAME}/tags/list" 2>/dev/null || echo "{}")
              HIGHEST=$(printf '%s' "$JSON" | jq -r '
                  [ .tags[]? // empty
                    | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) ]
                  | sort | last // empty' 2>/dev/null)
              if [[ -z "$HIGHEST" ]]; then
                NEXT="v0.1.0"
              else
                NEXT=$(printf '%s' "$HIGHEST" \
                    | awk -F. '{printf "v%d.%d.%d", $1+0, $2+0, $3+1}')
              fi
            fi
            TAGS="${IMG}:${NEXT},${IMG}:latest,${IMG}:sha-${SHORT_SHA}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags: ${TAGS}"
          # The version to tag/release on GitHub (same version as the GHCR tag)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            REL_TAG="$GITHUB_REF_NAME"
          else
            REL_TAG="$NEXT"
          fi
          echo "release_tag=${REL_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${REL_TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Create GitHub release
        if: steps.meta.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.release_tag }}"
          # Idempotent: skip if this tag already has a release (rerun, or a
          # manually created release won the race).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; skipping"
            exit 0
          fi
          ARGS=(--title "$TAG" --generate-notes)
          # Pre-release tags (contain a hyphen) are marked prerelease on GitHub.
          if [[ "$TAG" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          # main push: the tag does not exist yet, so create it at this SHA.
          # tag push: the tag already exists, so only create the release.
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            ARGS+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${ARGS[@]}"
          echo "created GitHub release $TAG"
