name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"

      - name: Sync deps (frozen)
        run: uv sync --frozen --no-dev

      - name: Byte-compile
        run: uv run python -m py_compile pull_congress.py

      - name: Type check
        run: uv run pyright pull_congress.py

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t congress-pull:ci .

      - name: Verify supercronic present
        run: docker run --rm --entrypoint /usr/local/bin/supercronic congress-pull:ci -version

  publish-image:
    name: Publish Docker image
    if: github.event_name == 'push'
    needs: [lint-and-typecheck, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          PKG="${GITHUB_REPOSITORY#*/}"
          PKG="${PKG,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              # pre-release tag (contains a hyphen, e.g. v0.2.0-beta.1) —
              # own tag only, do NOT bump `latest`
              TAGS="${IMG}:${GITHUB_REF_NAME}"
            else
              TAGS="${IMG}:${GITHUB_REF_NAME},${IMG}:latest"
            fi
          else
            # main push: auto-increment patch from the highest existing
            # vX.Y.Z tag on GHCR (registry-derived, like the npm stable
            # publish — never trust a possibly-stale local version).
            JSON=$(curl -fsSL \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                "https://api.github.com/user/packages/container/${PKG}/versions?per_page=100" 2>/dev/null || echo "{}")
            HIGHEST=$(printf '%s' "$JSON" | jq -r '
                [ .[]?.metadata.container.tags[]? // empty
                  | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) ]
                | sort | last // empty' 2>/dev/null)
            if [[ -z "$HIGHEST" ]]; then
              NEXT="v0.1.0"
            else
              NEXT=$(printf '%s' "$HIGHEST" \
                  | awk -F. '{printf "v%d.%d.%d", $1+0, $2+0, $3+1}')
            fi
            TAGS="${IMG}:${NEXT},${IMG}:latest,${IMG}:sha-${SHORT_SHA}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags: ${TAGS}"
          # The version to tag/release on GitHub (same version as the GHCR tag)
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            REL_TAG="$GITHUB_REF_NAME"
          else
            REL_TAG="$NEXT"
          fi
          echo "release_tag=${REL_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${REL_TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Create GitHub release
        if: steps.meta.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.release_tag }}"
          # Idempotent: skip if this tag already has a release (rerun, or a
          # manually created release won the race).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; skipping"
            exit 0
          fi
          ARGS=(--title "$TAG" --generate-notes)
          # Pre-release tags (contain a hyphen) are marked prerelease on GitHub.
          if [[ "$TAG" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          # main push: the tag does not exist yet, so create it at this SHA.
          # tag push: the tag already exists, so only create the release.
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            ARGS+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${ARGS[@]}"
          echo "created GitHub release $TAG"
