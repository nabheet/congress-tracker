[project]
name = "congress-tracker"
version = "0.1.0"
description = "Daily congressional stock-trade tracker. Pulls financial disclosure filings (Senate eFD + House Clerk) into Postgres."
requires-python = ">=3.14"
dependencies = [
    "psycopg==3.3.5",
    "psycopg-binary==3.3.5",
    "pdfplumber==0.11.10",
    "pdfminer.six==20260107",
    "Pillow==12.3.0",
    "pypdfium2==5.13.0",
    "charset-normalizer==3.5.1",
    "cryptography==50.0.1",
    "cffi==2.1.1",
    "pycparser==3.0",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "pyright==1.1.411",
]

[tool.uv]
# Script repo — pull_congress.py is not an importable package.
package = false
